name: Build APK (Android)

# Cancel older in-progress runs on the same branch/PR when a new commit lands
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Gradle variant to build"
        required: false
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      single_abi:
        description: "Build only arm64-v8a (faster, good for dev/test)"
        required: false
        default: true
        type: boolean

env:
  NODE_ENV: production

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Node.js setup with built-in npm cache
      # ---------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ---------------------------------------------------------------
      # 3. Java (Gradle needs a JDK — Temurin 17 matches current RN/Expo)
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # ---------------------------------------------------------------
      # 4. Gradle caching (wrapper, dependencies, build cache) —
      #    this is what eliminates most of the repeated download/setup time
      # ---------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ---------------------------------------------------------------
      # 5. Install JS dependencies
      #    --legacy-peer-deps kept to match the current dependency tree;
      #    remove once the peer-dep graph is cleaned up.
      # ---------------------------------------------------------------
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ---------------------------------------------------------------
      # 6. Sanity-check native module version alignment before building.
      #    Fails fast with a clear message instead of a 10-minute Gradle
      #    run that dies at assertWorkletsVersionTask.
      # ---------------------------------------------------------------
      - name: Verify Reanimated / Worklets compatibility
        run: |
          WORKLETS_VERSION=$(node -p "require('react-native-worklets/package.json').version")
          REANIMATED_VERSION=$(node -p "require('react-native-reanimated/package.json').version")
          echo "react-native-worklets: $WORKLETS_VERSION"
          echo "react-native-reanimated: $REANIMATED_VERSION"
          WORKLETS_MINOR=$(echo "$WORKLETS_VERSION" | cut -d. -f2)
          if [ "$WORKLETS_MINOR" -lt 13 ]; then
            echo "::error::react-native-worklets ($WORKLETS_VERSION) is below the 0.13.x floor required by react-native-reanimated ($REANIMATED_VERSION). Run: npm install react-native-worklets@^0.13.0 --save --legacy-peer-deps"
            exit 1
          fi

      # ---------------------------------------------------------------
      # 7. Restrict to a single ABI for faster dev/debug builds.
      #    Skipped entirely for release builds so all four ABIs still
      #    ship in the production APK/AAB.
      # ---------------------------------------------------------------
      - name: Restrict to arm64-v8a (dev builds only)
        if: ${{ github.event.inputs.single_abi != 'false' && github.event.inputs.build_variant != 'assembleRelease' }}
        run: |
          echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 8. Expo prebuild — regenerates native android/ project files.
      #    Safe to run every time; required after any native dependency
      #    version bump (e.g. the Worklets fix).
      # ---------------------------------------------------------------
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      # ---------------------------------------------------------------
      # 9. Gradle build
      # ---------------------------------------------------------------
      - name: Build with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ github.event.inputs.build_variant || 'assembleDebug' }} --stacktrace --build-cache

      # ---------------------------------------------------------------
      # 10. Upload the resulting APK(s) as a workflow artifact
      # ---------------------------------------------------------------
      - name: Locate and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_variant || 'assembleDebug' }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------
      # 11. Surface Gradle's own problems report on failure for faster
      #     debugging (the log mentioned this report but it's easy to miss)
      # ---------------------------------------------------------------
      - name: Upload Gradle problems report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report-${{ github.run_number }}
          path: android/build/reports/problems/problems-report.html
          if-no-files-found: ignore
