name: Publish ATS Engine to GitHub Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/ats-engine/**"
      - ".github/workflows/publish-package.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@jashan-randhawa"

      - name: Install dependencies
        working-directory: packages/ats-engine
        run: npm install

      - name: Build package
        working-directory: packages/ats-engine
        run: npm run build

      - name: Publish to GitHub Packages
        working-directory: packages/ats-engine
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
